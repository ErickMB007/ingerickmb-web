lidades\">Modalidades</a>\n      <a class=\"nav-cta\" href=\"#diagnostico\">Revisar mi sistema de adquisición <span>↗</span></a>\n    </nav>\n  </div>\n</header>\n\n<main id=\"contenido\">\n  <section class=\"story-opening\" aria-labelledby=\"story-title\">\n    <p class=\"eyebrow\"><span></span> SELL · ADQUISICIÓN DIGITAL</p>\n    <p class=\"story-intro\">La atención existe. Las oportunidades no llegan solas.</p>\n    <h1 id=\"story-title\">Hacer publicidad no garantiza tener un sistema de adquisición.</h1>\n\n    <div class=\"story-opening-copy\">\n      <p>Una empresa puede tener un buen producto, experiencia y capacidad para atender nuevos clientes. Sin embargo, si la estrategia, los anuncios, la infraestructura digital y el seguimiento funcionan por separado, las oportunidades se pierden en el camino.</p>\n      <p>El reto no es solamente generar más leads, sino <strong>convertir la inversión en marketing en conversaciones comerciales medibles y oportunidades con seguimiento.</strong></p>\n    </div>\n\n    <a class=\"story-link\" href=\"#servicio\">Reconoce dónde se rompe el recorrido <span>↓</span></a>\n  </section>\n\n  <section class=\"trust-strip\" aria-label=\"Componentes del sistema\">\n    <span>Estrategia</span><i></i>\n    <span>Meta Ads</span><i></i>\n    <span>Infraestructura digital</span><i></i>\n    <span>CRM y seguimiento</span>\n  </section>\n\n  <section class=\"section story-problem\" id=\"servicio\">\n    <div class=\"section-label\"><span>01</span> EL RECORRIDO INCOMPLETO</div>\n\n    <div class=\"story-grid\">\n      <div>\n        <p class=\"kicker\">Anuncio → lead → WhatsApp → silencio</p>\n        <h2>El problema no siempre es generar demanda. Es lo que ocurre después.</h2>\n      </div>\n\n      <div class=\"story-copy\">\n        <p>Muchas empresas comienzan invirtiendo en publicidad antes de tener claramente definida su oferta, cliente ideal, proceso comercial o sistema de seguimiento.</p>\n        <p>Llegan contactos, algunos preguntan, otros solicitan información y después comienza la pérdida de visibilidad: no se sabe quién respondió, qué prospecto avanzó, qué propuesta sigue abierta o qué campaña terminó generando una venta.</p>\n\n        <blockquote>“La publicidad puede iniciar una conversación. El sistema comercial es el que debe convertirla en una oportunidad.”</blockquote>\n\n        <a class=\"button whatsapp-button\" href=\"https://wa.me/529902122834?text=Hola%20Erick%2C%20quiero%20informaci%C3%B3n%20sobre%20SELL%20Adquisici%C3%B3n%20Digital.\" target=\"_blank\" rel=\"noopener noreferrer\">\n          Contactar por WhatsApp <span>↗</span>\n        </a>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"section sell-value\">\n    <div class=\"section-label\"><span>02</span> UNA INFRAESTRUCTURA DE ADQUISICIÓN</div>\n\n    <div class=\"value-grid\">\n      <div>\n        <p class=\"kicker\">SELL conecta el recorrido completo</p>\n        <h2>De inversión publicitaria a oportunidades comerciales medibles.</h2>\n      </div>\n\n      <div class=\"value-copy\">\n        <p>SELL no administra anuncios de manera aislada. Diseña e implementa el sistema que conecta estrategia, infraestructura digital, generación de demanda, CRM, seguimiento y analítica.</p>\n        <p>El objetivo no es acumular clics o contactos. Es construir un recorrido capaz de atraer, registrar, calificar y desarrollar oportunidades comerciales.</p>\n      </div>\n    </div>\n\n    <div class=\"sell-pillars\" aria-label=\"Componentes del sistema de adquisición\">\n      <span>Estrategia</span>\n      <span>Infraestructura</span>\n      <span>Demanda</span>\n      <span>CRM y pipeline</span>\n      <span>Seguimiento y datos</span>\n    </div>\n  </section>\n\n  <section class=\"sell-band\" id=\"sistema\">\n    <div class=\"section\">\n      <div class=\"section-label\"><span>03</span> DE LA ATENCIÓN A LA OPORTUNIDAD</div>\n\n      <div class=\"band-heading\">\n        <p class=\"kicker\">Un recorrido con intenci
